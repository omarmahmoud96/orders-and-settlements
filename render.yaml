services:
  - type: web
    name: orders-and-settlements-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn config.wsgi"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orders-and-settlements-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: orders-and-settlements-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: orders-and-settlements-db
    plan: free